# Builds DubStemMix.app and attaches the zip to the GitHub release that triggered the run.
#
# Publish a release (tag v<version>) → this workflow builds on a macOS runner with the newest Xcode
# available (Swift 6.2 needs Xcode 26), runs the tests, packages the app with tools/make-app.sh and
# uploads DubStemMix-<version>.zip to the release. No model file is ever built in or uploaded (see NOTICE).
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build number is the commit count

      - name: Select the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Version from the tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "Version $TAG"

      - name: Tests
        run: swift test 2>&1 | tail -20

      - name: Build the app
        run: tools/make-app.sh "${{ steps.version.outputs.version }}" dist

      - name: Check the app launches its self-tests
        run: |
          dist/DubStemMix.app/Contents/MacOS/DubStemMix --check-documents
          ls -la dist

      - name: Attach the zip to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/DubStemMix-*.zip --clobber

      # brew install --cask yoanbernabeu/tap/dubstemmix: point the cask at the zip just uploaded.
      # HOMEBREW_TAP_DEPLOY_KEY is a write deploy key of yoanbernabeu/homebrew-tap, and of that repository only.
      - name: Update the Homebrew cask
        if: github.event_name == 'release'
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SHA="$(shasum -a 256 "dist/DubStemMix-$VERSION.zip" | cut -d' ' -f1)"
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:yoanbernabeu/homebrew-tap.git tap
          cd tap
          sed -i '' -E "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 \".*\"/  sha256 \"$SHA\"/" Casks/dubstemmix.rb
          git diff --quiet && { echo "Cask already at $VERSION"; exit 0; }
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -am "DubStemMix $VERSION"
          git push

      - name: Keep the zip as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DubStemMix-${{ steps.version.outputs.version }}
          path: dist/DubStemMix-*.zip
