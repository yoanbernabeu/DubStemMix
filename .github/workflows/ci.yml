# Every push and pull request: build and unit tests (no model download, no audio device needed).
name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)/Contents/Developer" && swift --version
      - name: Build
        run: swift build
      - name: Tests
        run: swift test 2>&1 | tail -40

  # The desktop app (PRD § 17) on an ordinary Linux PC: it must build and play its test songs.
  desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build tools and headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential cmake git pkg-config libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev libcurl4-openssl-dev
      - name: Build
        run: desktop/build.sh
      - name: Self-test (no display, no sound card)
        run: desktop/build/dubstemmix-desktop --selftest
      - name: Screen test (the console played like a user, no display)
        run: desktop/build/dubstemmix-desktop --screentest "$RUNNER_TEMP/screen"
      - name: Keep the screen test's pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-screen-linux
          path: ${{ runner.temp }}/screen/*.png
          if-no-files-found: ignore
